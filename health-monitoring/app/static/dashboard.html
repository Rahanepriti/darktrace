<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CyArt DarkTrace - Health</title>
<style>
:root{--bg:#f6f7f9;--fg:#15181d;--card:#fff;--mut:#667085;--bd:#e3e6eb;--ok:#12a150;--warn:#d98a00;--bad:#d92d20}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--fg:#e6e9ee;--card:#171b22;--mut:#8b94a3;--bd:#262c36}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:960px;margin:0 auto;padding:20px}h1{font-size:18px;margin:0 0 14px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}
.lbl{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.big{font-size:26px;font-weight:600;margin-top:4px}.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-weight:600;color:#fff}
.healthy{background:var(--ok)}.degraded,.stale{background:var(--warn)}.unhealthy,.down{background:var(--bad)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd)}th{color:var(--mut);font-weight:500;font-size:12px}
#login{display:flex;gap:8px;margin-bottom:14px}input{flex:1;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg)}
button{padding:8px 14px;border:0;border-radius:8px;background:#2f6feb;color:#fff;cursor:pointer}svg{width:100%;height:46px}
#conn{color:var(--mut);font-size:12px;margin-top:10px}
</style></head><body><main>
<h1>CyArt DarkTrace &middot; Live health</h1>
<div id="login"><input id="tok" type="password" placeholder="Health API token" autocomplete="off"><button id="go">Connect</button></div>
<div class="row">
 <div class="card"><div class="lbl">Overall</div><div class="big"><span id="overall" class="pill">-</span></div></div>
 <div class="card"><div class="lbl">Database</div><div class="big"><span id="db" class="pill">-</span></div><div id="dbl" class="lbl"></div></div>
 <div class="card"><div class="lbl">Crawler</div><div class="big"><span id="cr" class="pill">-</span></div><div id="crd" class="lbl"></div></div>
 <div class="card"><div class="lbl">Queue depth</div><div class="big" id="qd">-</div><div id="aw" class="lbl"></div></div>
</div>
<div class="card" style="margin-bottom:12px"><div class="lbl">DB latency (ms, last 60 samples)</div><svg id="spark" viewBox="0 0 300 46" preserveAspectRatio="none"><polyline id="line" fill="none" stroke="#2f6feb" stroke-width="2"/></svg></div>
<div class="card"><div class="lbl" style="margin-bottom:6px">Workers</div>
<table><thead><tr><th>Worker</th><th>Status</th><th>Last heartbeat</th><th>Age</th><th>Queue</th></tr></thead><tbody id="wk"></tbody></table></div>
<div id="conn">disconnected</div>
</main><script>
var ws,hist=[],stop=false,$=function(i){return document.getElementById(i)};
function pill(el,s){el.textContent=s;el.className="pill "+s}
function td(tr,t){var c=document.createElement("td");if(t instanceof Node)c.appendChild(t);else c.textContent=t;tr.appendChild(c)}
function render(d){
 pill($("overall"),d.status);var c=d.components;
 pill($("db"),c.database.status);$("dbl").textContent=(c.database.latency_ms!=null?c.database.latency_ms+" ms":"")+(c.database.error?" · "+c.database.error:"");
 pill($("cr"),c.crawler.status);$("crd").textContent=c.crawler.detail||"";
 $("qd").textContent=c.crawler.queue_depth;$("aw").textContent=c.crawler.active_workers+" active · "+(c.crawler.stale_workers||0)+" stale";
 if(c.database.latency_ms!=null){hist.push(c.database.latency_ms);if(hist.length>60)hist.shift();
  var m=Math.max.apply(null,hist.concat([1]));$("line").setAttribute("points",hist.map(function(v,i){return (i*300/59).toFixed(1)+","+(44-v/m*40).toFixed(1)}).join(" "))}
 var tb=$("wk");tb.textContent="";(c.crawler.workers||[]).forEach(function(w){
  var tr=document.createElement("tr"),p=document.createElement("span");p.className="pill "+w.status;p.textContent=w.status;
  var age=w.last_heartbeat?Math.max(0,Math.round((Date.now()-Date.parse(w.last_heartbeat))/1000))+"s":"-";
  td(tr,w.worker_id);td(tr,p);td(tr,w.last_heartbeat?new Date(w.last_heartbeat).toLocaleTimeString():"-");td(tr,age);td(tr,w.queue_depth==null?"-":w.queue_depth);tb.appendChild(tr)})}
function connect(){
 stop=false;ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/api/v1/ws/monitor");
 ws.onopen=function(){ws.send(JSON.stringify({type:"auth",token:$("tok").value}));$("conn").textContent="connected - live"};
 ws.onmessage=function(e){var m=JSON.parse(e.data);if(m.type==="snapshot")render(m.data)};
 ws.onclose=function(e){if(e.code===1008){$("conn").textContent="authentication failed";stop=true}else{$("conn").textContent="disconnected - retrying";if(!stop)setTimeout(connect,3000)}}}
$("go").onclick=function(){if(ws)try{stop=true;ws.close()}catch(e){}connect()};
</script></body></html>
